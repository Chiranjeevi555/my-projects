<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Left Room</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video id="leftVid" src="./Assets/Videos/leftroom.mp4" loop></video>

  <script>
    document.addEventListener("click", () => {
      const video = document.getElementById("leftVid");
      video.play().catch(err => console.error("Playback error:", err));
    }, { once: true });
  </script>
</body>
</html>
